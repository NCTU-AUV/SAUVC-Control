# =============================================================================
# 模擬疊加值
# =============================================================================
# 只列「模擬與實機真正不同」的參數。啟動時疊在 orca_params.yaml 與
# hardware.yaml 之後，其餘一律沿用實機設定。
#
# 這份檔案取代了舊的 simulation_control.launch.py —— 那是 orca_bringup.launch.py
# 的複製貼上分支，兩邊已經開始各自漂移。現在模擬與實機共用同一個
# bringup.launch.py，差異只有 sim:=true 決定「啟不啟動硬體節點」，
# 加上這份疊加值。
#
# 檔案短是刻意的。每多一行，就代表多一項「在模擬裡調好、到實機不成立」的風險。
# -----------------------------------------------------------------------------

/**/supervisor_node:
  ros__parameters:
    # 模擬沒有實體 kill switch，也沒有需要等待解鎖的 ESC。
    require_not_killed: false
    require_thrusters_enabled: false
    # 沒有 STM32 可燒。
    auto_flash_stm32_on_startup: false
