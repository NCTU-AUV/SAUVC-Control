# =============================================================================
# Bag 錄製設定
# =============================================================================
# 被 orca_bringup/launch/record.launch.py 讀取。改這裡不用重新 colcon build
# （package 以 symlink-install 安裝 config 目錄），但要重新 launch 才生效。
# -----------------------------------------------------------------------------

storage:
  # mcap 而非預設的 sqlite3。AUV 靠 kill switch 直接斷電，sqlite3 遇硬斷電
  # 容易整包損毀；mcap 對檔案截斷友善，最壞只損失最後一段。
  storage_id: mcap

  # 分段長度（秒）。配合上面的理由：斷電時只有當前這一段有風險。
  max_bag_duration_s: 120

  # 啟動前檢查目標磁碟剩餘空間，低於此值就不錄並印警告，而不是把系統碟寫滿。
  min_free_space_gb: 5.0

# -----------------------------------------------------------------------------
# 預設錄製的 topic（相對於載具 namespace，launch 時會自動加上前綴）
#
# 挑選原則：足以離線重建整條控制鏈路的因果關係 ——
# 感測輸入 → 目標 → PID 輸出 → wrench 匯流排 → 分配 → 推進器指令，
# 外加系統模式，才能回答「當時為什麼推進器出這個力」。
# -----------------------------------------------------------------------------
topics:
  # --- 感測輸入（STM32 / 模擬） ---
  - sensors/depth_m
  - sensors/imu
  - sensors/killed

  # --- 轉換後的狀態 ---
  - state/depth_m
  - state/orientation

  # --- 控制目標 ---
  - control/targets/depth_m

  # --- Wrench 匯流排：每個來源都要，才能事後拆解合力的組成 ---
  - control/wrench_sources/gui
  - control/wrench_sources/depth
  - control/wrench_sources/decision
  - control/wrench_sources/bottom_camera
  - control/wrench_command

  # --- PID 中間量 ---
  - control/pid/depth/sink_force_N

  # --- 致動 ---
  - thrusters/thruster_0/force_N
  - thrusters/thruster_1/force_N
  - thrusters/thruster_2/force_N
  - thrusters/thruster_3/force_N
  - thrusters/thruster_4/force_N
  - thrusters/thruster_5/force_N
  - thrusters/thruster_6/force_N
  - thrusters/thruster_7/force_N
  - thrusters/pwm_us
  - thrusters/enabled
  - thrusters/set_enabled
  - thrusters/initializing

  # --- 系統狀態 ---
  - system_manager/mode
  - system_manager/status

# -----------------------------------------------------------------------------
# 絕對路徑的 topic（不加 namespace 前綴）。
# 決策層跑在另一個 container 且用自己的 global namespace。
# -----------------------------------------------------------------------------
absolute_topics:
  - /rosout
  - /orca/decision/status
  - /orca/decision/camera_mode

# -----------------------------------------------------------------------------
# 影像 topic：預設不錄。用 `record_images:=true` 開啟。
#
# 原始影像會吃爆儲存並拖垮 I/O，在 Orin NX 上同時要跟 TensorRT 推論搶頻寬，
# 所以只錄壓縮過的。四路加起來原始約 130 MB/s、壓縮後約 13 MB/s。
#
# 這些名稱不是任何相機節點原本的 topic，而是 autonomy 容器裡的 republish 節點
# 專為錄製轉出來的（見 orca_perception/launch/perception.launch.py 的
# record_images）。這麼做有兩個理由：
#
#   1. **壓縮外掛只有 autonomy 容器有。** control 容器只裝了核心 image_transport，
#      沒有 compressed_image_transport / compressed_depth_image_transport，
#      轉不出壓縮影像。錄製端不需要外掛，它只是訂閱 CompressedImage。
#   2. **實機與模擬的相機 topic 名稱不同**（實機在 /orca 底下，模擬在載具
#      namespace 底下）。轉發到固定名稱之後，這份清單兩邊通用。
#
# 兩邊的 record_images 必須一起開：control 堆疊負責錄，autonomy 堆疊負責轉，
# 只開一邊會錄到一組完全空的 topic。用 `make sim RECORD_IMAGES=true` 一次帶到。
#
# 深度**不壓縮**，直接錄原始 32FC1。
#
# compressedDepth 會把深度做反距離量化存成 uint16，上限寫死在 10 m（實測
# ConfigHeader 為 depthQuantA=10100、depthQuantB=-1009，還原式
# depth_m = A / (uint16 - B)，碼值 1 就已經對應 10.0 m，再遠會算出負數而被
# 當成無效值丟掉），而這個 Humble build 的外掛沒有開放 depth_max 參數。
# 10 m 以內精度極好（3 m 處誤差 0.3 mm），但池子場景遠達 16 m —— 池壁與
# gate 後方的背景會整片變無效，而 _estimate_gate 正是靠那些背景深度做左右
# 對稱性判斷，拿這種 bag 重跑不會重現現場行為。
#
# 代價很實際：640x480x4B x 30 Hz ≈ 37 MB/s，其餘三路壓縮後合計才 1.6 MB/s。
# 開了影像錄製就是約 2.3 GB/min，錄之前先確認 ORCA_BAG_DIR 那顆碟的空間。
# -----------------------------------------------------------------------------
absolute_image_topics:
  - /orca/record/front/compressed
  - /orca/record/bottom/compressed
  - /orca/record/detections/compressed
  # 實機的深度來源（RealSense 對齊後的深度）。模擬沒有這條，見下面。
  - /orca/aligned_depth_to_color/image_raw

# 載具 namespace 底下的影像 topic。
#
# 模擬的深度掛在載具 namespace 下（/$(ns)/depth/image_raw），實機則在 /orca
# 底下，所以兩條都列、各自放在對的清單裡，讓同一份設定在兩種情境都成立 ——
# 沒有發布者的那條會是空的，跟 GUI 同時列出實機與模擬相機 topic 的做法一致。
#
# 這裡原本列的是 color/image_raw/compressed 與 camera/bottom/image_raw/compressed，
# 但整個堆疊沒有任何節點發布過 compressed 影像，所以 record_images:=true 一直
# 是錄到兩條空 topic（--include-unpublished-topics 讓它連錯誤都不會報）。
image_topics:
  - depth/image_raw
